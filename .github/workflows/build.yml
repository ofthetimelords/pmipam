name: Build and Publish Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate version and cachebust values
        id: vars
        run: |
          echo "pl_version=$(date '+%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "cachebust=$(date +%s)" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKER_PASS" | tr -d '\r\n' | docker login -u "$(printf '%s' "$DOCKER_USER" | tr -d '\r\n')" --password-stdin
    
      - name: Build the Docker image
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CACHEBUST=${{ steps.vars.outputs.cachebust }}
          tags: |
            vtable/pmipam:${{ steps.vars.outputs.pl_version }}
            vtable/pmipam:latest
